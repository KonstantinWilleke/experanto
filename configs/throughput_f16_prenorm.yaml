dataset:
  global_sampling_rate: null
  global_chunk_size: null
  add_behavior_as_channels: False
  replace_nans_with_means: False
  modality_config:
    screen:
      keep_nans: False
      sampling_rate: 30
      chunk_size: 16
      valid_condition:
        tier: "train"
      offset: 0
      sample_stride: 1
      include_blanks: true
      transforms:
        normalization: False
      interpolation:
        rescale: False
        rescale_size: null
        dtype: "float16"
        interleave_value: [0.40354313, 0.55193976, 0.70105263]
    responses_30Hz_permissive_stability_criteria:
      keep_nans: False
      sampling_rate: 30
      chunk_size: 16
      offset: 0 # in seconds
      transforms:
        normalization: "standardize"
      interpolation:
        interpolation_mode: "nearest_neighbor"
    eye_tracker:
      keep_nans: False
      sampling_rate: 30
      chunk_size: 16
      offset: 0
      transforms:
        normalization: False
      interpolation:
        interpolation_mode: "nearest_neighbor"
    blinks:
      keep_nans: False
      sampling_rate: 30
      chunk_size: 16
      offset: 0
      transforms:
        normalization: False
      interpolation:
        interpolation_mode: "nearest_neighbor"

dataloader:
  batch_size: 8
  shuffle: true
  num_workers: 8
  pin_memory: False
  drop_last: True
  prefetch_factor: 2


datapath:
  files: ["37_3843837605846_0_V3A_V4",]
  root: "/path/to/dataset" # path to the dataset root directory


distributed:
  min_samples_per_epoch: 10000
  max_batches: 1000
  move_to_device: False
  enable_cuda: False