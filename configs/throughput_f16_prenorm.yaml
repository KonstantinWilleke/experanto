dataset:
  global_sampling_rate: null
  global_chunk_size: null
  add_behavior_as_channels: False
  replace_nans_with_means: False
  modality_config:
    screen:
      keep_nans: False
      sampling_rate: 30
      chunk_size: 16
      valid_condition:
        tier: "train"
      offset: 0
      sample_stride: 1
      include_blanks: true
      transforms:
        normalization: null
      interpolation:
        rescale: False
        rescale_size: null
        dtype: "float16"
        interleave_value: [0.40354313, 0.55193976, 0.70105263]
    responses_30Hz_permissive_stability_criteria:
      keep_nans: False
      sampling_rate: 30
      chunk_size: 16
      offset: 0 # in seconds
      transforms:
        normalization: "standardize"
      interpolation:
        interpolation_mode: "nearest_neighbor"
    eye_tracker:
      keep_nans: False
      sampling_rate: 30
      chunk_size: 16
      offset: 0
      transforms:
        normalization: False
      interpolation:
        interpolation_mode: "nearest_neighbor"
    blinks:
      keep_nans: False
      sampling_rate: 30
      chunk_size: 16
      offset: 0
      transforms:
        normalization: False
      interpolation:
        interpolation_mode: "nearest_neighbor"

dataloader:
  batch_size: 8
  shuffle: true
  num_workers: 2
  pin_memory: False
  drop_last: True
  prefetch_factor: 2


datapath:
  files: ["35_3832003544063_1_V1",]
  root: "/path/to/dataset" # path to the dataset root directory


distributed:
  backend: "nccl"
  datasets_per_rank: 1
  sync_epochs: True
  min_samples_per_epoch: 10000
  max_batches: 5000